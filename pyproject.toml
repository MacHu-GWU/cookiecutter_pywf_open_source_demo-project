# ==============================================================================
# The [project] table defined by Official python.org
#
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# ==============================================================================
[project]
name = "cookiecutter_pywf_open_source_demo"
# The single source of truth for the version. Bump it before each release,
# following `semantic versioning <https://semver.org/>`_, then run ``mise run inst``
# so ``uv.lock`` records the new version (see the pywf-oss-release skill).
version = "1.0.4"
description = "An example project generated by cookiecutter-pywf_open_source."
# Read https://dev-exp-share.readthedocs.io/en/latest/search.html?q=Pick+An+Open+Source+License+For+Python+Project&check_keywords=yes&area=default
# To pick a license and update the ``license``, ``classifier`` field in ``pyproject.toml``
# And also update the ``LICENSE.txt`` file in the git repo.
license = "MIT"
license-files = ["LICENSE.txt", "AUTHORS.rst"]
authors = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
maintainers = [
    { name = "Sanhe Hu", email = "husanhe@gmail.com" },
]
keywords = []
readme = "README.rst"
requires-python = ">=3.11,<4.0"
# Full list of classifiers: https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# ------------------------------------------------------------------------------
# Core Dependencies
#
# uv workflow: edit the lists below, then run ``mise run inst`` (``uv sync --all-extras``),
# which updates ``uv.lock`` and ``.venv``. Never ``pip install``. ``mise run export``
# regenerates the requirements*.txt files from ``uv.lock`` for tools that need them.
# ------------------------------------------------------------------------------
dependencies = [
]

# ------------------------------------------------------------------------------
# Optional dependency that can be used in ``pip install ${your_project_name}[${feature_name}]``
# Sometime this is also called "extras"
# Read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#dependencies-optional-dependencies
#
# IMPORTANT: every optional dependency must support every Python version in "requires-python"
# ------------------------------------------------------------------------------
[project.optional-dependencies]

# ------------------------------------------------------------------------------
# Local Development dependencies
# ------------------------------------------------------------------------------
dev = [
    "rich>=14.3.4,<15.0.0", # pretty print
]

# ------------------------------------------------------------------------------
# (Unit/Coverage/Integration/Load) Test dependencies
# ------------------------------------------------------------------------------
test = [
    "pytest>=9.1.1,<10.0.0", # Testing framework
    "pytest-cov>=7.1.0,<8.0.0", # Coverage reporting
]

# ------------------------------------------------------------------------------
# Documentation build dependencies
# ------------------------------------------------------------------------------
doc = [
    "Sphinx>=8.2.3,<9.0.0",
    "sphinx-copybutton>=0.5.2,<1.0.0", # add copy button to code block
    "sphinx-design>=0.7.0,<1.0.0", # add additional design pattern to sphinx
    "sphinx-jinja>=2.0.2,<3.0.0", # enable jinja syntax in reStructuredText
    "furo==2025.12.19", # the furo sphinx theme
    "pygments>=2.18.0,<3.0.0", # syntax highlight
    "ipython>=8.18.1,<8.19.0", # interactive Python
    "ipykernel>=7.3.0,<8.0.0", # Jupyter kernel, to execute docs notebooks locally
    "nbsphinx>=0.9.8,<1.0.0", # add jupyter notebook in sphinx doc
    "rstobj==2.0.0", # generate reStructuredText from Python code
    "docfly==3.0.3", # automaticall generate .. toctree directives and API reference doc
]

# ------------------------------------------------------------------------------
# Mise task runner dependencies
# ------------------------------------------------------------------------------
mise = [
    "PyGithub>=2.8.0,<3.0.0", # GitHub API client
    "httpx2>=2.13.1,<3.0.0", # HTTP client for Codecov and ReadTheDocs APIs (pydantic-maintained successor of httpx)
]

# Quick Links
[project.urls]
Homepage = "https://github.com/MacHu-GWU/cookiecutter_pywf_open_source_demo-project"
Documentation = "https://cookiecutter-pywf-open-source-demo.readthedocs.io/en/latest/"
Repository = "https://github.com/MacHu-GWU/cookiecutter_pywf_open_source_demo-project"
Issues = "https://github.com/MacHu-GWU/cookiecutter_pywf_open_source_demo-project/issues"
Changelog = "https://github.com/MacHu-GWU/cookiecutter_pywf_open_source_demo-project/blob/main/release-history.rst"
Download = "https://pypi.org/pypi/cookiecutter-pywf-open-source-demo#files"

# For command line interface, read: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts
[project.scripts]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "cookiecutter_pywf_open_source_demo*",
]
exclude = [
    "cookiecutter_pywf_open_source_demo.tests",
    "cookiecutter_pywf_open_source_demo.tests.*",
    "cookiecutter_pywf_open_source_demo.docs",
    "cookiecutter_pywf_open_source_demo.docs.*",
]

# ------------------------------------------------------------------------------
# ruff: format with "mise run format", check with "mise run lint"
# ------------------------------------------------------------------------------
[tool.ruff]
extend-exclude = [
    "cookiecutter_pywf_open_source_demo/vendor",
    ".claude/skills/*/assets", # templates with <package> placeholders, not valid Python
]

[tool.ruff.lint.per-file-ignores]
# re-export modules: the imports are the public names, not unused imports
"**/__init__.py" = ["F401"]
"**/api.py" = ["F401"]

# ------------------------------------------------------------------------------
# pytest 9+ reads this native TOML table (not the older [tool.pytest.ini_options]).
# Read: https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
# Keep it small: the run_cov_test helper and the mise tasks pass their own options.
# ------------------------------------------------------------------------------
[tool.pytest]
testpaths = ["tests"]
# strict = true # strict config, markers, xfail and parametrize ids; only with a pinned pytest
# filterwarnings = ["error"] # turn every warning into a failure
# markers = ["slow: tests that take more than a few seconds"]

# ------------------------------------------------------------------------------
# Build: ``mise run build`` runs ``uv build`` with this backend, and ``mise run publish``
# uploads the result with ``uv publish``. setuptools 77+ is needed for the SPDX
# ``license`` expression and ``license-files`` (PEP 639).
# ------------------------------------------------------------------------------
[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
